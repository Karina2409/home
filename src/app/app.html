@if (authService.loading()) {
    <div class="bg-background flex h-screen w-screen items-center justify-center">
        <p-progressSpinner strokeWidth="4" />
    </div>
} @else {
    <div class="bg-background min-h-screen">
        <!-- Desktop Sidebar -->
        @if (authService.isAuthenticated()) {
            <app-sidebar class="hidden md:block" />
        }

        <!-- Main Content -->
        <main
            [class.md:ml-64]="authService.isAuthenticated()"
            [class.pb-20]="authService.isAuthenticated()"
            class="md:pb-0">
            <router-outlet />
        </main>

        <!-- Mobile Bottom Nav -->
        @if (authService.isAuthenticated()) {
            <app-bottom-nav />
        }
    </div>
}
