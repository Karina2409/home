<nav
    class="fixed bottom-0 left-0 right-0 z-50 md:hidden bg-surface/90 backdrop-blur-md border-t border-border shadow-nav">
    <div class="flex items-center justify-around px-2 py-1">
        @for (item of navItems; track item.route) {
            <a
                [routerLink]="item.route"
                routerLinkActive="text-primary"
                [routerLinkActiveOptions]="{ exact: false }"
                class="flex flex-col items-center gap-0.5 py-2 px-3 rounded-xl text-xs font-medium text-muted hover:text-text-secondary transition-colors"
            >
                <i [class]="item.icon" class="text-lg"></i>
                <span>{{ item.label }}</span>
            </a>
        }
    </div>
    <div class="h-[env(safe-area-inset-bottom)]"></div>
</nav>
