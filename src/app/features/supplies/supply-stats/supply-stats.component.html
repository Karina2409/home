<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
    @for (stat of stats(); track stat.label) {
        <div class="bg-surface rounded-2xl p-4 shadow-card flex items-center gap-4 animate-fade-in">
            <div
                class="w-12 h-12 rounded-xl flex items-center justify-center text-xl"
                [style.background-color]="stat.iconBg"
                [style.color]="stat.iconColor"
            >
                <i [class]="stat.icon"></i>
            </div>
            <div>
                <p class="text-sm text-muted">{{ stat.label }}</p>
                <p class="text-2xl font-bold text-text">{{ stat.value }}</p>
            </div>
        </div>
    }
</div>
