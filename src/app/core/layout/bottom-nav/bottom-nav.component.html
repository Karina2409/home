<nav
    class="bg-surface/90 border-border shadow-nav fixed right-0 bottom-0 left-0 z-50 border-t backdrop-blur-md md:hidden">
    <div class="flex items-center justify-around px-2 py-1">
        @for (item of navItems; track item.route) {
            <a
                [routerLink]="item.route"
                routerLinkActive="text-primary"
                [routerLinkActiveOptions]="{ exact: false }"
                class="text-muted hover:text-text-secondary flex flex-col items-center gap-0.5 rounded-xl px-3 py-2 text-xs font-medium transition-colors">
                <i [class]="item.icon" class="text-lg"></i>
                <span>{{ item.label }}</span>
            </a>
        }
    </div>
    <div class="h-[env(safe-area-inset-bottom)]"></div>
</nav>
