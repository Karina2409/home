<aside class="h-screen w-64 bg-surface flex flex-col border-r border-gray-100 fixed left-0 top-0 z-40">
    <!-- Logo -->
    <div class="p-6 pb-4">
        <div class="flex items-center gap-3 mb-1">
            <div
                class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white text-lg font-bold">
                <i class="pi pi-home"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-primary leading-tight">Family Hearth</h1>
                <p class="text-xs text-muted">Наш Дом</p>
            </div>
        </div>
        <div
            class="mt-3 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-secondary/15 text-secondary-dark text-xs font-medium">
            <i class="pi pi-users text-xs"></i>
            <span>4 Члена семьи</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-2">
        @for (item of navItems; track item.route) {
            <a
                [routerLink]="item.route"
                routerLinkActive="bg-primary/10 text-primary-dark"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors mb-1"
            >
                <i [class]="item.icon" class="text-base"></i>
                <span>{{ item.label }}</span>
            </a>
        }
    </nav>

    <!-- Settings -->
    <div class="p-4 border-t border-gray-100">
        <a
            routerLink="/settings"
            routerLinkActive="bg-primary/10 text-primary-dark"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors"
        >
            <i class="pi pi-cog text-base"></i>
            <span>Настройки</span>
        </a>
    </div>
</aside>
