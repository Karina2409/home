<div
    class="bg-surface shadow-card hover:shadow-card-hover animate-fade-in relative rounded-2xl p-5 transition-shadow">
    <!-- Status Badge -->
    <div class="absolute top-4 right-4">
        @if (supply().status === 'low') {
            <span
                class="bg-danger/10 text-danger inline-flex items-center rounded-lg px-2.5 py-1 text-xs font-semibold tracking-wide uppercase">
                Мало
            </span>
        } @else if (supply().status === 'enough') {
            <span
                class="bg-success/10 text-success inline-flex items-center rounded-lg px-2.5 py-1 text-xs font-semibold tracking-wide uppercase">
                Достаточно
            </span>
        } @else {
            <span
                class="bg-hover text-muted inline-flex items-center rounded-lg px-2.5 py-1 text-xs font-semibold tracking-wide uppercase">
                Нет
            </span>
        }
    </div>

    <!-- Icon & Name -->
    <div class="mb-3 flex items-start gap-3 pr-20">
        <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-lg"
            [style.background-color]="supply().iconBg"
            [style.color]="'#666'">
            <i [class]="supply().icon"></i>
        </div>
        <div>
            <h3 class="text-text text-base leading-tight font-semibold">{{ supply().name }}</h3>
            <p class="text-muted mt-0.5 text-xs">{{ supply().location }}</p>
        </div>
    </div>

    <!-- Quantity Control -->
    <div class="mt-4 flex items-center justify-between">
        <div>
            <p class="text-muted mb-1 text-xs font-medium tracking-wider uppercase">Количество</p>
            <p class="text-text text-2xl font-bold">{{ supply().quantity }}</p>
        </div>
        <div class="flex items-center gap-2">
            <button
                (click)="onDecrement()"
                class="bg-hover hover:bg-border text-text-secondary flex h-9 w-9 items-center justify-center rounded-full transition-colors">
                <i class="pi pi-minus text-xs"></i>
            </button>
            <button
                (click)="onIncrement()"
                class="bg-primary hover:bg-primary-dark flex h-9 w-9 items-center justify-center rounded-full text-white transition-colors">
                <i class="pi pi-plus text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Delete -->
    <div class="border-border-light mt-4 flex justify-end border-t pt-3">
        <button
            (click)="onDelete()"
            class="text-muted hover:text-danger flex items-center gap-1.5 text-xs transition-colors">
            <i class="pi pi-trash"></i>
            <span>Удалить</span>
        </button>
    </div>
</div>
