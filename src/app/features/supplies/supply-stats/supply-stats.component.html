<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
    @for (stat of stats(); track stat.label) {
        <div class="bg-surface shadow-card animate-fade-in flex items-center gap-4 rounded-2xl p-4">
            <div
                class="flex h-12 w-12 items-center justify-center rounded-xl text-xl"
                [style.background-color]="stat.iconBg"
                [style.color]="stat.iconColor">
                <i [class]="stat.icon"></i>
            </div>
            <div>
                <p class="text-muted text-sm">{{ stat.label }}</p>
                <p class="text-text text-2xl font-bold">{{ stat.value }}</p>
            </div>
        </div>
    }
</div>
