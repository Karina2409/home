<p-toast />

<div class="mx-auto max-w-6xl p-4 md:p-8">
    <!-- Header -->
    <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
            <h1 class="text-text text-3xl font-bold">Запасы</h1>
            <p class="text-muted mt-1">Хозяйственные товары и средства для дома</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-muted hidden text-sm md:inline"
                >Всего предметов: {{ totalCount() }}</span
            >
            <button
                pButton
                icon="pi pi-plus"
                label="Добавить предмет"
                class="p-button-primary"
                (click)="openAddDialog()"></button>
        </div>
    </div>

    <!-- Stats -->
    <app-supply-stats [totalCount]="totalCount()" [lowCount]="lowCount()" [outCount]="outCount()" />

    <!-- Search -->
    <div class="mb-6">
        <span class="p-input-icon-left w-full md:w-80">
            <i class="pi pi-search"></i>
            <input
                pInputText
                type="text"
                [(ngModel)]="searchQuery"
                placeholder="Поиск товаров..."
                class="w-full" />
        </span>
    </div>

    <!-- Loading -->
    @if (loading()) {
        <!--        <div class="flex justify-center py-16">-->
        <!--            <p-progressSpinner strokeWidth="4"/>-->
        <!--        </div>-->
    } @else {
        <!-- Grid -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            <!-- Add Card -->
            <button
                (click)="openAddDialog()"
                class="bg-surface border-border hover:border-primary/40 hover:bg-primary/5 group flex min-h-[200px] flex-col items-center justify-center gap-3 rounded-2xl border-2 border-dashed p-5 transition-all">
                <div
                    class="bg-hover group-hover:bg-primary/10 text-muted group-hover:text-primary flex h-12 w-12 items-center justify-center rounded-full transition-colors">
                    <i class="pi pi-plus text-xl"></i>
                </div>
                <div class="text-center">
                    <p
                        class="text-text-secondary group-hover:text-primary font-medium transition-colors">
                        Добавить товар
                    </p>
                    <p class="text-muted mt-0.5 text-xs">Пополнить запасы дома</p>
                </div>
            </button>

            <!-- Supply Cards -->
            @for (supply of filteredSupplies(); track supply.id) {
                <app-supply-card
                    [supply]="supply"
                    (increment)="onIncrement($event)"
                    (decrement)="onDecrement($event)"
                    (delete)="onDelete($event)" />
            }
        </div>

        <!-- Empty State -->
        @if (filteredSupplies().length === 0) {
            <div class="py-16 text-center">
                <div
                    class="bg-hover mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full">
                    <i class="pi pi-search text-muted text-2xl"></i>
                </div>
                <p class="text-text-secondary font-medium">Ничего не найдено</p>
                <p class="text-muted mt-1 text-sm">Попробуйте изменить запрос поиска</p>
            </div>
        }
    }
</div>

<!-- Form Dialog -->
<app-supply-form
    [visible]="dialogVisible()"
    [supply]="selectedSupply()"
    (visibleChange)="dialogVisible.set($event)"
    (submit)="onFormSubmit($event)" />
