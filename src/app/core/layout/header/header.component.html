<!-- MOBILE HEADER -->
<header
    class="flex md:hidden items-center justify-between p-4 bg-[#FBF9F6] sticky top-0 z-10 border-b border-[#EFEAE4]">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-[#7D5241] text-white flex items-center justify-center font-bold">
            <i class="pi pi-home"></i>
        </div>
        <h1 class="font-serif font-bold text-2xl text-[#4A3B32]">Family Hearth</h1>
    </div>
    <button class="p-2 text-[#6B5A4D]">
        <i class="pi pi-cog text-xl"></i>
    </button>
</header>

<!-- MAIN HEADER & ACTIONS -->
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
        <div class="flex justify-between items-baseline md:block">
            <h2 class="font-serif text-3xl font-bold text-[#3B2C23]">Запасы</h2>
            <span class="text-xs md:hidden text-[#8C7A6B]">Всего предметов: {{ totalCount() }}</span>
        </div>
        <p class="hidden md:block text-sm text-[#8C7A6B]">Хозяйственные товары и средства для дома</p>
    </div>

    <div class="flex items-center gap-3">
        <!-- Поиск -->
        <div class="relative flex-1 md:w-72">
            <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-[#8C7A6B]"></i>
            <input
                type="text"
                [ngModel]="searchQuery()"
                (ngModelChange)="onSearchChange($event)"
                placeholder="Поиск товаров..."
                class="w-full pl-9 pr-4 py-2.5 rounded-full border border-[#E8E2DA] bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#7D5241]"
            />
        </div>

        <!-- Кнопка Добавить (Десктоп) -->
        <button
            (click)="openAddModal.emit()"
            class="hidden md:flex items-center gap-2 bg-[#7D5241] hover:bg-[#654133] text-white px-5 py-2.5 rounded-full font-medium transition shadow-sm cursor-pointer">
            <i class="pi pi-plus"></i> Добавить предмет
        </button>
    </div>
</div>
