<div class="mx-auto max-w-2xl p-4 md:p-8">
    <div class="mb-6">
        <button pButton [text]="true" (click)="goBack()">
            <i pButtonIcon class="pi pi-arrow-left"></i>
            <span pButtonLabel>Назад</span>
        </button>
    </div>

    <div class="bg-surface border-border rounded-2xl border p-6">
        <h1 class="text-text mb-6 text-2xl font-bold">
            {{ isEdit() ? 'Редактировать вопрос' : 'Новый вопрос' }}
        </h1>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
            <div>
                <label for="questionText" class="text-text mb-2 block text-sm font-medium">Текст вопроса</label>
                <textarea
                    id="questionText"
                    pInputTextarea
                    formControlName="text"
                    rows="4"
                    class="w-full"
                    placeholder="Введите вопрос для вашей пары..."></textarea>
            </div>

            <div>
                <label for="questionCategory" class="text-text mb-2 block text-sm font-medium">Категория</label>
                <p-select
                    id="questionCategory"
                    formControlName="category"
                    [options]="categories()"
                    placeholder="Выберите категорию"
                    class="w-full" />
            </div>

            <div class="mt-4 flex justify-end gap-3">
                <button pButton severity="secondary" [text]="true" type="button" (click)="goBack()">
                    <span pButtonLabel>Отмена</span>
                </button>
                <button pButton type="submit" [disabled]="form.invalid">
                    <i pButtonIcon class="pi pi-check"></i>
                    <span pButtonLabel>Сохранить</span>
                </button>
            </div>
        </form>
    </div>
</div>
