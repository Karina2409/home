<aside
    class="bg-surface fixed top-0 left-0 z-40 flex h-screen w-64 flex-col border-r border-gray-100">
    <!-- Logo -->
    <div class="p-6 pb-4">
        <div class="mb-1 flex items-center gap-3">
            <div
                class="bg-primary flex h-10 w-10 items-center justify-center rounded-full text-lg font-bold text-white">
                <i class="pi pi-home"></i>
            </div>
            <div>
                <h1 class="text-primary text-lg leading-tight font-bold">Family Hearth</h1>
                <p class="text-muted text-xs">Наш Дом</p>
            </div>
        </div>
        <div
            class="bg-secondary/15 text-secondary-dark mt-3 inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium">
            <i class="pi pi-users text-xs"></i>
            <span>4 Члена семьи</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-2">
        @for (item of navItems; track item.route) {
            <a
                [routerLink]="item.route"
                routerLinkActive="bg-primary/10 text-primary-dark"
                class="mb-1 flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50">
                <i [class]="item.icon" class="text-base"></i>
                <span>{{ item.label }}</span>
            </a>
        }
    </nav>

    <!-- Settings -->
    <div class="border-t border-gray-100 p-4">
        <a
            routerLink="/settings"
            routerLinkActive="bg-primary/10 text-primary-dark"
            class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50">
            <i class="pi pi-cog text-base"></i>
            <span>Настройки</span>
        </a>
        <a
            (click)="authService.logout()"
            class="mb-1 flex cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50">
            <i class="pi pi-sign-out"></i>
            <span>Выйти</span>
        </a>
    </div>
</aside>
